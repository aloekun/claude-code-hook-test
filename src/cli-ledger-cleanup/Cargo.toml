[package]
name = "cli-ledger-cleanup"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cli-ledger-cleanup"
path = "src/main.rs"

[dependencies]
# 台帳の解釈は lib-ledger に集約する (ADR-024)。本 exe は CLI 面 (引数・出力・exit コード) だけを担う。
lib-ledger = { path = "../lib-ledger" }
# 順位 table の part 列挙 (`todo-summary*.md`) を借りる。**in-repo の path 依存であって
# 外部 crate ではない** (下記の方針の対象外)。決め打ちの配列で part を数えると、分割の
# たびに後始末が壊れる — 2026-09-03 の 3 分割で実際にその状態になっていた (CodeRabbit #473)。
# 列挙の定義は F1 が cli-docs-lint 側の docs_files へ集約済みで、そこを参照する。
cli-docs-lint = { path = "../cli-docs-lint" }

# 外部 crate 依存は足さない。本 exe は「実装が完了したか」を判定して後始末の可否を決める
# ゲートであり、供給元が増えるほど判定を曲げられる面が広がる (lib-ledger と同じ論理)。

# [profile.release] は workspace root (Cargo.toml) に集約 (ADR-026)
