# review-request — bot 作成 PR へ CodeRabbit レビューを要求する
#
# 役割: 自律 actor (夜間ループ / Phase B 等) が作った PR は CodeRabbit の自動レビュー
# 対象にならないため、**人間資格情報**で `@coderabbitai review` を 1 回だけ投稿する。
#
# ## なぜこの workflow が要るのか (2026-08-10 実測で確定)
#
# CodeRabbit は **PR の author が bot なら自動レビューをスキップする** (公式挙動
# "Auto Review Skipped — Bot user detected")。本リポジトリでも実測した:
#
# | 経路 | 結果 |
# |---|---|
# | bot 作成 PR の auto_review | skip (#379 が 10 時間超 無反応) |
# | bot が `@coderabbitai review` を投稿 | 無視 (#373 が 10 時間 無反応) |
# | 人間が `@coderabbitai review` を投稿 | 動く (#373 は 4 秒、#378 は 5 秒で応答) |
# | CodeRabbit を reviewer に要求 | GitHub API が 422 (App は collaborator ではない) |
# | PR を reopen | 無効 (状態遷移では skip が解除されない) |
# | 設定で bot を許可 | schema.v2.json に該当キーが存在しない |
#
# **人間 identity のコメント投稿が唯一の経路**である。これは消去法ではなく、
# 上表のすべてを実測して確定した (docs/adr/adr-072-nightly-todo-loop.md)。
#
# ## なぜ nightly-todo.yml の中に置かないのか
#
# nightly-todo の job は**未信頼の agent が実装を書き、その成果物を `cargo test` が
# 実行する** job である。ADR-072 は決定 5 で agent に Bash を与えず、決定 8 § 副次効果で
# agent が触れる GITHUB_TOKEN を read-only にした。さらに同 ADR のスモークで
# **唯一未解決なのが「cargo サブプロセスへのトークン露出」**である。
# その job に人間資格情報を置くと、未解決の露出リスクの対象に人間 PAT が加わる。
# 本 workflow は agent を一切動かさないため、PAT はここにしか存在しない。
#
# ## PAT の権限と、ADR-072 決定 8 との関係
#
# `CODERABBIT_TRIGGER_PAT` は fine-grained PAT で **Pull requests: write のみ**
# (対象リポジトリ 1 つ、期限付き)。決定 8 が PAT を却下した理由は「オーナー権限で
# ADR-067 の ruleset backstop を bypass する」ことだったが、**この PAT は push も
# マージもできない** (どちらも Contents: write が必要) ため、その懸念は成立しない。
# 実体は ADR-072 § 外部設定の実体 に記録する (ADR-051 決定 1)。
#
# ## pull_request_target を使うことの危険と、その封じ方
#
# public リポジトリでは **fork からの PR でも本 workflow が起動し、その時点で
# secrets へアクセスできる**。したがって:
#
# - PR ブランチを **checkout しない** (コードを一切実行しない)
# - `run:` へ展開するのは **PR 番号 (整数) だけ**。タイトル / 本文 / ブランチ名などの
#   攻撃者制御文字列はシェルに渡さない (script injection → secret 窃取の経路)
# - fork PR を条件で除外する
#
# ## 投稿しただけで成功としない
#
# ADR-072 決定 11 は「投稿できたか」しか見ておらず、bot 投稿が無視されている事実に
# **10 時間気づけなかった**。本 workflow は投稿後に CodeRabbit の反応を確認し、
# 無ければ **red で落とす**。助言層なので他を止めはしないが、無音にはしない。
#
# ## 反応があったことも成功としない (順位 431)
#
# 2026-08-11 の夜間ループ実走 (PR #387) で CodeRabbit が `Review limit reached` を
# 返したのに、検証が「要求後にコメントが 1 件以上付いたか」だけを見ていたため
# **拒否も success として記録**され、未レビューの自律 PR がどこにも信号として
# 残らなかった。検証段は反応の**中身**を 3 分類し、レビューが始まった陽性証拠が
# 無い限り success にしない (ADR-064 陽性証拠の要求 / ADR-043 fail-closed)。
#
# **リトライは作らない** (ADR-019 § M5)。本 workflow が出すのは「この PR が未レビュー
# のまま残った」という即時信号だけで、再要求はしない。後から未レビュー PR を全体で
# 拾い直す経路 (weekly-review の自律アクション棚卸し) とは役割が別で、本 workflow が
# red で落ちても後段の棚卸しは独立に動く。
name: review-request

on:
  pull_request_target:
    types: [opened]

# PAT が投稿を担うため、GITHUB_TOKEN 側に書き込みは不要。読み取りだけに使う。
# `issues: read` を併記するのは、PR のコメントが `/issues/{n}/comments` 配下にあり
# どちらの scope で読めるかが端点により揺れるため (読み取り専用なので過剰付与のリスクは
# 無く、確認 step が 403 で偽の red になるのを防ぐ)。
# `contents: read` は既定ブランチの autonomy-config.toml (kill-switch の config 面) を
# 読むために要る。
permissions:
  pull-requests: read
  issues: read
  contents: read

concurrency:
  group: review-request-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request:
    # 4 条件の AND (いずれか 1 つでも欠ければ起動しない = fail-closed):
    #   1. PR author が Bot (App 改名に強い。login 直書きだと改名で黙って止まる)
    #   2. fork からの PR ではない (fork PR で secrets を使う経路を塞ぐ)
    #   3. base が本リポジトリ
    #   4. kill-switch の variable 面 (ADR-066)。**config 面は job 内の step で見る**
    #      — workflow 式からはリポジトリ内ファイルを読めないため。ADR-066 の
    #      kill-switch は variable と config の 2 面 AND なので、片面だけで起動判定を
    #      終えると `enabled = false` にしても投稿できてしまう
    if: >-
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      vars.AUTONOMY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # 検証段の待機上限 (15 分) + auto 検出の猶予 (75 秒) + 前段 step の余裕。
    # 順位 431 で成功条件を「反応があった」から「レビュー実体が来た」へ上げたため
    # 上限を広げてあり、順位 520 で auto 検出の猶予を足した。
    timeout-minutes: 20
    env:
      # **CodeRabbit コメントの分類を 1 か所に置く。** auto 検出 step と検証 step の
      # 両方が同じ分類を必要とするため、片方だけ追随して非対称になる形を作らない
      # (ADR-081)。1 行につき `<comment id> <分類>` を出す。id を残すのは「要求より
      # 新しいコメントだけを見る」絞り込みを shell 側で行うため (comment id は単調増加)。
      #
      # 分類の優先順位は **rate-limit が先**。ack が拒否と言っているのに walkthrough
      # marker を持つコメント (placeholder) が同時に存在しうる — #387 では 3 秒差で
      # 両方が投稿された。先に陽性証拠を探すと placeholder を「レビュー実体」と読んで
      # silent success に戻る。markers.rs の is_clean_walkthrough_comment も rate-limit を
      # 優先して弾いており、判定順序をそちらに揃える。
      JQ_CLASSIFY: >-
        .[]
        | select(.user.login == "coderabbitai[bot]")
        | (.body // "") as $b
        | [ (.id | tostring),
            (if ($b | contains("Rate limit exceeded"))
                or ($b | contains("rate limited by coderabbit.ai"))
                or ($b | contains("Review rate limited."))
             then "RATE_LIMITED"
             elif ($b | contains("Review finished."))
             then "ACK_FINISHED"
             elif ($b | contains("<!-- This is an auto-generated comment: summarize by coderabbit.ai -->"))
             then "WALKTHROUGH"
             else "OTHER"
             end) ]
        | join(" ")
    steps:
      # **checkout しない。** PR のコードは一切取得も実行もしない。
      # 必要なのは PR 番号だけで、それは event payload から得られる。

      # kill-switch の config 面 (ADR-066)。既定ブランチの autonomy-config.toml を
      # **API で読む** (checkout しないため)。PR ブランチ側ではなく既定ブランチから
      # 読むのは ADR-072 の信頼境界と同じ理由 — 自律 actor が自分の停止フラグを
      # 書き換えて自己解除する経路を作らない。
      #
      # **「意図した停止」と「読めなかった」を区別する。** 前者は green で終え、後者は
      # red にする (ADR-072 決定 10 と同じ分類)。読めないまま素通りさせると、
      # kill-switch が効いているのか壊れているのか run 一覧から分からなくなる。
      - name: Check the config side of the kill-switch
        id: killswitch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$DEFAULT_BRANCH" in
            ''|*[!A-Za-z0-9._/-]*)
              echo "[REVIEW_REQUEST] 既定ブランチ名が想定外です: '$DEFAULT_BRANCH'"
              exit 1
              ;;
          esac
          if ! CONFIG=$(gh api "repos/${REPO}/contents/autonomy-config.toml?ref=${DEFAULT_BRANCH}" \
                -H "Accept: application/vnd.github.raw" 2>&1); then
            echo "[REVIEW_REQUEST] autonomy-config.toml を読めません (kill-switch の状態を確定できない)"
            echo "$CONFIG" | head -3
            exit 1
          fi
          # [autonomy] セクション内の enabled だけを見る。他 section の同名キーを
          # 拾わないよう、セクション境界で切ってから判定する。
          ENABLED_LINE=$(printf '%s\n' "$CONFIG" | awk '
            /^\[/ { in_section = ($0 ~ /^\[autonomy\]/) ; next }
            in_section && /^[[:space:]]*enabled[[:space:]]*=/ { print $0 }
          ' | head -1)
          echo "[REVIEW_REQUEST] config: ${ENABLED_LINE:-<enabled キー無し>}"
          # コメントと空白を除いた値だけを厳密一致で判定する。substring match
          # (`*true*`) だと `enabled = false  # ... true ...` のようなコメント付き
          # 行が誤って proceed=true になり、fail-closed 契約が壊れる。
          ENABLED_VALUE=$(printf '%s\n' "$ENABLED_LINE" | sed 's/#.*//' | awk -F= '{gsub(/[[:space:]]/,"",$2); print $2}')
          case "$ENABLED_VALUE" in
            true)
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "[REVIEW_REQUEST_SKIP] kill-switch の config 面が有効ではありません。投稿しません"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # **auto が効いているなら要求しない (順位 520)。**
      #
      # 本 workflow は「bot 作成 PR は CodeRabbit の auto レビュー対象外」(2026-08-10 /
      # 2026-09-08 実測) を土台に作られたが、**2026-09-10 頃に auto が戻った**。PR 作成の
      # 2〜8 秒後に CodeRabbit が自発 walkthrough を出す (#494 / #502 / #507 / #510 の
      # 初動タイムラインで実測、4/4)。その状態で要求を重ねると:
      #
      #   - 二重依頼になりレビュー枠を消費する
      #   - 要求への ack は `Review finished. / does not re-review already reviewed
      #     commits` になり、要求より **前** に出た walkthrough は comment id の窓から
      #     外れるため、検証段が 900 秒待って red になる (4 PR で実際に起きた誤 red)
      #
      # **どちらの挙動にも耐える形にする。** auto が効いているかを毎回実測し、効いて
      # いれば要求せず検証だけ行う。効いていなければ従来どおり PAT で要求する — auto が
      # また止まる夜への保険を残す。CodeRabbit の挙動は短期間で何度も変わるため、
      # どちらか一方を前提に固定しない (`.coderabbit.yaml` 冒頭が経緯を持つ)。
      #
      # **猶予を置く。** auto の walkthrough は PR 作成の数秒後に出るが、本 workflow の
      # 起動と競合する (2026-09-10 の run は起動 18:14:33 / 通知 18:14:34)。即断すると
      # 「まだ出ていない」を「auto は効いていない」と読み違えて二重依頼に戻るため、
      # 15 秒間隔で 6 回照会する (最後の照会の後は待たないので、最大の待ち時間は 75 秒)。
      # 実測の初動は 2〜8 秒なので十分な余裕がある。
      #
      # **rate-limit を見つけたら auto 扱いにしない。** 拒否されている以上レビューは
      # 来ない。従来どおり要求を投げ、検証段が rate-limit として red にする
      # (ADR-019 § M5 のとおりリトライはしない)。
      - name: Detect whether CodeRabbit's automatic review already covers this PR
        id: autocheck
        if: steps.killswitch.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # **auto の判定も HEAD に紐づける。** コメントの walkthrough marker で判定すると、
          # HEAD が進んだ後の手動 re-run で「旧 HEAD の walkthrough」を現 HEAD の auto と
          # 読み違え、要求を投げないまま検証段が red になる (#513 の CodeRabbit 指摘)。
          #
          # CodeRabbit は**レビュー開始時点で HEAD に commit status を付ける**
          # (`pending` / `Review in progress`)。PR #510 の実測では PR 作成の 9 秒後で、
          # 完了 (`success` / `Review completed`) はその 3 分後だった。開始の signal が
          # head-anchored で得られるので、コメントを見る必要が無い。
          if ! HEAD_SHA=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha'); then
            echo "[REVIEW_REQUEST] HEAD SHA を取得できません。auto 判定を諦め、従来どおり要求します"
            echo "auto_active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AUTO_GRACE_ATTEMPTS=6
          for i in $(seq 1 "$AUTO_GRACE_ATTEMPTS"); do
            # 照会の一時失敗を「auto は効いていない」と読み替えない。判定を下すのは
            # 猶予を使い切ったときだけにする (検証段の判定と同じ方針)。
            if CLASSES=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
                 --jq "$JQ_CLASSIFY" 2>/dev/null | awk '{ print $2 }'); then
              if printf '%s\n' "$CLASSES" | grep -qx 'RATE_LIMITED'; then
                echo "[REVIEW_REQUEST] CodeRabbit は rate-limit を返しています。auto 扱いにせず従来どおり要求します"
                echo "auto_active=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            # **`state` だけを見ない。** CodeRabbit は skip も `success` で通知する
            # (`Review skipped: bot user not eligible for review` /
            # `Review skipped: incremental reviews are disabled` を実測)。state だけで
            # 判定すると、レビューしていない PR を「レビュー済み」と読む。
            # 開始 (`pending`) か完了 (`Review completed`) のどちらかを求める。
            if STARTED=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/status" \
                 --jq '[.statuses[]? | select((.context | ascii_downcase) == "coderabbit")
                        | select(.state == "pending" or ((.state == "success") and (.description // "" | contains("Review completed"))))] | length' \
                 2>/dev/null); then
              if [ "${STARTED:-0}" -gt 0 ]; then
                echo "[REVIEW_REQUEST_AUTO] CodeRabbit の自発レビューを HEAD ${HEAD_SHA} で確認しました (${i} 回目)。要求は投稿しません"
                echo "auto_active=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            if [ "$i" -lt "$AUTO_GRACE_ATTEMPTS" ]; then
              sleep 15
            fi
          done
          echo "[REVIEW_REQUEST] 75 秒待っても CodeRabbit の自発レビューを確認できません。従来どおり PAT で要求します"
          echo "auto_active=false" >> "$GITHUB_OUTPUT"

      # **冪等にする。** `opened` は PR ごとに 1 回だが、run の手動 re-run や後段の
      # 検証失敗後の再実行で二重投稿になりうる。ADR-019 § 再トリガー抑止ガードのとおり
      # 同一 HEAD への `@coderabbitai review` 再投稿は**レート枠を消費するだけ**で、
      # 無料枠運用では実害がある。既存の要求があればそれを起点に検証だけ行う。
      - name: Post the review request (human identity), or reuse an existing one
        id: request
        if: >-
          steps.killswitch.outputs.proceed == 'true' &&
          steps.autocheck.outputs.auto_active != 'true'
        env:
          # 人間資格情報。これがコメントの投稿者 identity になる (本 workflow の要)。
          GH_TOKEN: ${{ secrets.CODERABBIT_TRIGGER_PAT }}
          # **整数のみ**を env 経由で渡す。文字列フィールドは一切シェルへ入れない。
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "[REVIEW_REQUEST] secret CODERABBIT_TRIGGER_PAT が未設定です"
            echo "[REVIEW_REQUEST] 未設定を「投稿不要」と読み替えない (ADR-043)"
            exit 1
          fi
          # PR 番号が整数であることを自前でも確認する。event payload は GitHub 生成の
          # 整数だが、ここが唯一シェルへ入る値なので二重に固める。
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "[REVIEW_REQUEST] PR 番号が整数ではありません: '$PR_NUMBER'"
              exit 1
              ;;
          esac
          # `--slurp` は `--jq` と併用できない (gh 2.95.0 で実測)。`--paginate` 単体だと
          # jq はページごとに適用され出力が連結されるため、**id をストリームで出して
          # shell 側で畳む**。これなら全ページを取りこぼさない。
          #
          # **空でないことと、使えることは別。** 上の `-z` ガードは未設定しか見ない。
          # secret が登録済みでも期限切れなら、この最初の API 呼び出しが
          # `gh: Bad credentials (HTTP 401)` という gh の生エラーだけを残して落ち、
          # **どの secret の話か・何をすれば直るかがログから読めない**。
          # 2026-09-06〜09-10 に実際そうなり、夜間 PR 3 本がレビュー 0 件のまま進んだ
          # (うち 2 本はマージ済み)。失効を名指しで報告するため、ここで応答を分類する。
          #
          # 新しい端点 (`gh api user` 等) を preflight に足さないのは、本 PAT の
          # fine-grained 権限で通る保証が無いため。**既に通る実績のあるこの呼び出し**を
          # そのまま診断点に使う。
          #
          # **部分一致で探さない。** `contains` だと、コマンド名に言及しているだけの
          # コメントを既存のレビュー要求と誤認する。実際に PR #494 で 2 件誤マッチした:
          #   - CodeRabbit の skip 通知「To trigger a single review, invoke the
          #     `@coderabbitai review` command.」(bot 作成 PR には必ず付く)
          #   - pr-monitor の分析コメント (本文でコマンド名を引用する)
          # 誤認すると「既に要求済み」と判断して投稿を飛ばし、**レビューが永久に走らない**。
          # skip 通知は本 workflow の起動と数秒差で投稿されるため、部分一致のままだと
          # 競合の結果次第で挙動が変わる (2026-09-10 の run は起動 18:14:33 / 通知 18:14:34)。
          #
          # そこで **投稿者と本文の厳密一致**で判定する:
          #   - 本文が前後の空白を除いて `@coderabbitai review` と完全一致すること
          #   - 投稿者が Bot でないこと (本 workflow は PAT の人間 identity で投稿する。
          #     誤マッチした 2 件はどちらも Bot だった)
          #
          # 空白の除去に `\s` を使わない。**jq は `\s` を文字列エスケープとして受け付けず**、
          # `sub("^\\s+";"")` は parse エラーになって**全件が 0 件に落ちる** (2026-09-11 に実測)。
          # 0 件は「既存要求なし」と読まれるため、壊れていても投稿は続き、失敗が静かになる。
          # POSIX 文字クラスなら backslash を挟まずに書ける。
          if ! EXISTING=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.type != "Bot") | select((.body | sub("^[[:space:]]+";"") | sub("[[:space:]]+$";"")) == "@coderabbitai review") | .id' \
            2> "$RUNNER_TEMP/pat-err.txt" | sort -n | tail -1); then
            echo "[REVIEW_REQUEST] レビュー要求の前段 (既存コメントの確認) に失敗しました"
            echo "[REVIEW_REQUEST] gh の応答:"
            sed 's/^/[REVIEW_REQUEST]   /' "$RUNNER_TEMP/pat-err.txt"
            if grep -qE 'HTTP 401|Bad credentials' "$RUNNER_TEMP/pat-err.txt"; then
              echo "[REVIEW_REQUEST] 原因: secret CODERABBIT_TRIGGER_PAT の認証エラー (GitHub が資格情報を拒否)"
              echo "[REVIEW_REQUEST]       secret は登録済みだが値が使えない = 期限切れ / 失効の可能性が高い"
              echo "[REVIEW_REQUEST] 対処: fine-grained PAT を再発行し、リポジトリの"
              echo "[REVIEW_REQUEST]       Settings > Secrets and variables > Actions > CODERABBIT_TRIGGER_PAT を更新する"
              echo "[REVIEW_REQUEST]       権限は Pull requests: Read and write のみ / 対象は本リポジトリのみ (ADR-072 決定 16)"
            elif grep -qE 'HTTP 403' "$RUNNER_TEMP/pat-err.txt"; then
              echo "[REVIEW_REQUEST] 原因: 認証は通ったが権限が足りない (HTTP 403)"
              echo "[REVIEW_REQUEST] 対処: PAT の対象リポジトリと Pull requests: Read and write の付与を確認する"
            else
              echo "[REVIEW_REQUEST] 原因: 認証エラー以外の失敗 (上の応答を参照)"
            fi
            echo "[REVIEW_REQUEST] この step が通らない限り bot 作成 PR は CodeRabbit にスキップされ、"
            echo "[REVIEW_REQUEST] レビューが一度も走らないまま PR が進む (ADR-043 に従い fail-closed で止める)"
            exit 1
          fi
          if [ -n "$EXISTING" ]; then
            echo "[REVIEW_REQUEST] 既にレビュー要求が存在します (comment id=${EXISTING})。再投稿しません"
            echo "since_id=${EXISTING}" >> "$GITHUB_OUTPUT"
            echo "posted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `gh api` で投稿するのは、**作成したコメントの id を得る**ため。
          # 検証段はこの id より新しい CodeRabbit コメントだけを数える。
          # 読み取りが通っても投稿が 403 になる形 (権限不足) があるため、投稿側にも
          # 同じ粒度の診断を置く。ここで黙って落ちると「読めたのに投稿されていない」と
          # いう最も追いにくい状態になる。
          if ! NEW_ID=$(gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -f body='@coderabbitai review' --jq '.id' 2> "$RUNNER_TEMP/pat-post-err.txt"); then
            echo "[REVIEW_REQUEST] レビュー要求の投稿に失敗しました"
            echo "[REVIEW_REQUEST] gh の応答:"
            sed 's/^/[REVIEW_REQUEST]   /' "$RUNNER_TEMP/pat-post-err.txt"
            echo "[REVIEW_REQUEST] 対処: CODERABBIT_TRIGGER_PAT に Pull requests: Read and write が"
            echo "[REVIEW_REQUEST]       付与され、対象リポジトリに本リポジトリが含まれるかを確認する"
            exit 1
          fi
          echo "[REVIEW_REQUEST] PR #${PR_NUMBER} へレビュー要求を投稿しました (comment id=${NEW_ID})"
          echo "since_id=${NEW_ID}" >> "$GITHUB_OUTPUT"
          echo "posted=true" >> "$GITHUB_OUTPUT"


      # **効果を観測する。** 決定 11 の失敗は「投稿は成功したが相手が反応しなかった」
      # ことに気づけなかった点にある。投稿の成否ではなく **CodeRabbit の反応**を待つ。
      #
      # **成功証拠を head に固定する (順位 520)。** 旧実装は「要求コメントより新しい
      # walkthrough marker 付きコメント」を成功条件にしていたが、これは 2 つの理由で
      # 壊れた:
      #
      #   1. auto の walkthrough は**要求より前**に出る。comment id の窓 (`> SINCE_ID`)
      #      から構造的に外れ、レビューが完了していても 900 秒で red になる
      #      (#494 / #502 / #507 / #510 の 4 PR で実際に発生した誤 red)
      #   2. walkthrough marker は placeholder にも付く。marker の有無だけでは
      #      「レビューが始まった」と「レビューが終わった」を区別できない
      #
      # 代わりに **現 HEAD に紐づく完了証拠**を 2 系統で見る。どちらも CodeRabbit が
      # commit を名指しして出すもので、コメントの投稿順に依存しない:
      #
      #   - **commit status**: `repos/{repo}/commits/{head}/status` に context
      #     `CodeRabbit` / state `success` (実測 description は `Review completed`)。
      #     指摘ゼロで完了したレビューはこれしか出さない
      #   - **reviews API**: CodeRabbit の review の `commit_id` が現 HEAD と一致
      #
      # この 2 系統は `src/cli-pr-monitor/src/stages/coderabbit_reviewed.rs` の
      # `head_already_reviewed` と同じ判定である。本 workflow は `pull_request_target`
      # で動き **checkout もコード実行もしない** (PAT を持つ job の信頼境界) ため
      # その関数を呼べず、bash で同じ照会を書いている。両者がずれないことは
      # `scripts/lint-workflows.mjs` の契約検査が集合比較で固定する (ADR-081 決定 1)。
      #
      # **ack も成功証拠に数える。** `@coderabbitai review` への直接の応答が
      # `✅ Action performed` + `Review finished.` なら、CodeRabbit 自身が完了を
      # 宣言している。head 側の証拠が遅れて現れる窓を埋める (要求を投げた場合のみ有効。
      # 投げていない run では過去の ack を拾わないよう `SINCE_ID` で絞る)。
      #
      # **rate-limit を陽性証拠より先に見る。** 副作用として「解除後 15 分以内に本当に
      # レビューが完了した」稀なケースも red になるが、これは意図した安全側 (未取得扱い)
      # の誤りである。marker は `src/check-ci-coderabbit/src/markers.rs` と対で管理する。
      - name: Verify CodeRabbit actually reviewed (head-anchored evidence)
        if: steps.killswitch.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # 要求を投稿した場合のみ入る。auto が効いていて要求を省いた run では空。
          SINCE_ID: ${{ steps.request.outputs.since_id }}
          AUTO_ACTIVE: ${{ steps.autocheck.outputs.auto_active }}
          # 要求を新規投稿した run だけ true。既存要求の再利用は false (ack を数えない)。
          POSTED: ${{ steps.request.outputs.posted }}
        run: |
          # GitHub Actions は run: を `bash -e {0}` で起動するため `set -uo pipefail` と
          # 書いても -e は外れない (PR #428 で実 run 観測)。-e を明示し、失敗を許す箇所は
          # 個別に手当てする。
          set -euo pipefail
          # 要求を投げた run では起点 id が必須。投げていない run (auto 済み) では空でよいが、
          # **「投げたのに id が取れなかった」を空と同一視しない** — 前者は検証の起点を
          # 失っており、黙って続けると ack を数えられないまま success / red を判定する。
          if [ "${AUTO_ACTIVE:-}" != "true" ]; then
            case "$SINCE_ID" in
              ''|*[!0-9]*)
                echo "[REVIEW_REQUEST_FAIL] 起点となる comment id を取得できていません: '$SINCE_ID'"
                exit 1
                ;;
            esac
          fi

          if ! HEAD_SHA=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha'); then
            echo "[REVIEW_REQUEST_FAIL] PR の HEAD SHA を取得できません。成功証拠を head に固定できないため red にします"
            exit 1
          fi
          case "$HEAD_SHA" in
            ''|*[!0-9a-f]*)
              echo "[REVIEW_REQUEST_FAIL] HEAD SHA が想定外です: '$HEAD_SHA'"
              exit 1
              ;;
          esac
          echo "[REVIEW_REQUEST] 成功証拠を HEAD ${HEAD_SHA} に固定して待ちます"

          # commit status に CodeRabbit の**完了**があるか。照会失敗・parse 不能は
          # 「無い」ではなく「判定不能」なので 1 を返し、deadline まで待ち続ける。
          #
          # **`state == "success"` だけでは足りない。** CodeRabbit は skip も success で
          # 通知する。実測した description は 4 種類:
          #   success / `Review completed`                                  … 完了 (これだけが陽性)
          #   success / `Review skipped: bot user not eligible for review`  … 未レビュー
          #   success / `Review skipped: incremental reviews are disabled`  … 未レビュー
          #   pending / `Review in progress`                                … 進行中
          # state だけを見ると後ろの 3 つも「レビュー済み」になり、レビューが走っていない
          # PR が green で通る (ADR-064 が禁じる silent success)。
          #
          # **「skip を除く」ではなく「完了を求める」形にする。** 除外リスト方式だと
          # CodeRabbit が新しい skip 文言を足したとき黙って陽性に倒れる。未知の文言は
          # 「完了ではない」= red 側へ落ちる方が安全側である (ADR-043)。この文言は
          # `coderabbit_reviewed.rs` と対で管理し、lint の契約検査が同期を固定する。
          reviewed_via_commit_status() {
            local hits
            hits=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/status" \
              --jq '[.statuses[]? | select((.context | ascii_downcase) == "coderabbit")
                     | select(.state == "success" and ((.description // "") | contains("Review completed")))] | length' \
              2>/dev/null) || return 1
            [ "${hits:-0}" -gt 0 ]
          }

          # CodeRabbit の review が現 HEAD を名指ししているか。
          # 突き合わせに `grep` を使わないのは、一致 0 件 (= まだレビューされていない、
          # ここでは正常系) の exit 1 を `-e` / `pipefail` が拾って step ごと落とすため。
          # `awk` なら一致 0 件でも exit 0 で返る (契約検査 3)。
          reviewed_via_reviews_api() {
            local commit_ids hit
            commit_ids=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
              --jq '.[] | select(.user.login == "coderabbitai[bot]") | .commit_id' \
              2>/dev/null) || return 1
            hit=$(printf '%s\n' "$commit_ids" \
              | awk -v head="$HEAD_SHA" '$0 == head { found = 1 } END { print found + 0 }')
            [ "$hit" -eq 1 ]
          }

          DEADLINE=30
          SEEN_OTHER=false
          for i in $(seq 1 "$DEADLINE"); do
            # 照会の一時失敗を「反応なし」と読み替えない。API blip で偽の red を出すと、
            # 本当に反応していない夜と区別がつかなくなる (決定 11 と逆向きの同じ誤り)。
            # 判定を下すのは deadline 到達時だけにする。
            if RAW=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
                 --jq "$JQ_CLASSIFY" 2>/dev/null); then
              # 下の ACK_FINISHED 判定と同じくこの run に属する rate-limit だけを見る。
              # 要求を投げた run (SINCE_ID あり) では、その要求より前の陳腐化した
              # rate-limit コメントを拾うと、この run で実際に取得できた
              # head-anchored evidence (commit status success / reviews API 一致) より
              # 先に red 判定してしまう (この diff 自身が解消しようとした誤 red と同型)。
              # SINCE_ID が空 (AUTO_ACTIVE=true) の run では unscoped のままでよい —
              # 前段の autocheck step が同じ unscoped 判定で先に RATE_LIMITED を弾いて
              # おり、そこを通過して auto_active=true になった時点で過去の rate-limit
              # コメントは存在しないと分かっている。
              if [ -n "${SINCE_ID:-}" ]; then
                RATE_LIMITED_FOUND=$(printf '%s\n' "$RAW" | awk -v since="$SINCE_ID" \
                  '$1 + 0 > since + 0 && $2 == "RATE_LIMITED" { found = 1 } END { print found + 0 }')
              else
                RATE_LIMITED_FOUND=$(printf '%s\n' "$RAW" | awk '$2 == "RATE_LIMITED" { found = 1 } END { print found + 0 }')
              fi
              if [ "$RATE_LIMITED_FOUND" -eq 1 ]; then
                echo "[REVIEW_REQUEST_RATE_LIMITED] CodeRabbit がレート制限で要求を拒否しました。**この PR は未レビューです**"
                # 解除見込みが本文にあれば人間が再要求する時刻の手掛かりとして run log に
                # 残す。**command ack には待ち時間が書かれない** (「Review rate limited.」の
                # 1 行だけ) ため、walkthrough placeholder 側の文言も併せて拾う。どちらも
                # 取れなければ黙って諦める (文言 format は変わりうる)。
                # 一致が無いのは正常系 (ack には待ち時間が書かれない)。grep をパイプに置くと
                # 一致 0 件の exit 1 が pipefail + -e で step を殺し、この後の案内行が消える。
                # awk なら一致 0 件でも exit 0 で、件数制限も自前で持てる (head との組み合わせで
                # 起きる SIGPIPE も避けられる)。
                gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
                  --jq '.[] | select(.user.login == "coderabbitai[bot]") | (.body // "")' \
                  > "$RUNNER_TEMP/cr-bodies.txt" 2>/dev/null || true
                awk 'n < 3 && tolower($0) ~ /review limit reached|available in/ {
                       print "[REVIEW_REQUEST_RATE_LIMITED] " $0; n++
                     }' "$RUNNER_TEMP/cr-bodies.txt"
                echo "[REVIEW_REQUEST_RATE_LIMITED] ADR-019 § M5 によりリトライはしません。解除後に人間が再要求してください"
                exit 1
              fi
              # ack は「**この run が投稿した要求**への応答」なので、新規投稿した run で
              # のみ数える。既存要求を再利用した run (`posted=false`) で `SINCE_ID` だけを
              # 条件にすると、前回 run が受け取った**旧 HEAD に対する ack** を現 HEAD の
              # 完了証拠として読み、未レビューのまま green になる (#513 の CodeRabbit 指摘)。
              # 再利用 run では head-anchored evidence だけを見る。
              ACK_FOUND=0
              if [ "${POSTED:-}" = "true" ] && [ -n "${SINCE_ID:-}" ]; then
                ACK_FOUND=$(printf '%s\n' "$RAW" | awk -v since="$SINCE_ID" \
                  '$1 + 0 > since + 0 && $2 == "ACK_FINISHED" { found = 1 } END { print found + 0 }')
              fi
              if [ "$ACK_FOUND" -eq 1 ]; then
                echo "[REVIEW_REQUEST] CodeRabbit が完了を宣言しました (ack: Review finished.、${i} 回目の確認)"
                exit 0
              fi
              # 「この要求に対して CodeRabbit が何か言ったか」なので、rate-limit / ack と
              # 同じく SINCE_ID でスコープする。未スコープだと過去のコメントが 1 件でも
              # あれば常に true になり、失敗時のメッセージが「反応が無い」と「反応は
              # あったが実体が来ない」を取り違える。要求を投げていない run では
              # 起点が無いので未スコープのまま (autocheck が walkthrough を確認済み)。
              if [ -n "${SINCE_ID:-}" ]; then
                SEEN_SINCE=$(printf '%s\n' "$RAW" | awk -v since="$SINCE_ID" \
                  '$1 + 0 > since + 0 { found = 1 } END { print found + 0 }')
              else
                SEEN_SINCE=$(printf '%s\n' "$RAW" | awk 'NF > 0 { found = 1 } END { print found + 0 }')
              fi
              if [ "$SEEN_SINCE" -eq 1 ]; then
                SEEN_OTHER=true
              fi
            fi
            if reviewed_via_commit_status; then
              echo "[REVIEW_REQUEST] commit status に CodeRabbit の完了を確認しました (HEAD ${HEAD_SHA}、${i} 回目の確認)"
              exit 0
            fi
            if reviewed_via_reviews_api; then
              echo "[REVIEW_REQUEST] CodeRabbit の review が現 HEAD を名指ししています (${HEAD_SHA}、${i} 回目の確認)"
              exit 0
            fi
            sleep 30
          done
          if [ "${AUTO_ACTIVE:-}" = "true" ]; then
            echo "[REVIEW_REQUEST_FAIL] 自発レビューは始まりましたが、$((DEADLINE * 30)) 秒たっても完了証拠が"
            echo "[REVIEW_REQUEST_FAIL] HEAD ${HEAD_SHA} に付きませんでした。**この PR は未レビュー扱いです**"
            echo "[REVIEW_REQUEST_FAIL] CodeRabbit 側が途中で止まったか、完了の通知 format が変わった"
            echo "[REVIEW_REQUEST_FAIL] 可能性があります (commit status の context / reviews API の commit_id)。"
            exit 1
          fi
          if [ "$SEEN_OTHER" = "true" ]; then
            echo "[REVIEW_REQUEST_FAIL] CodeRabbit は反応しましたが、レビュー実体を確認できませんでした ($((DEADLINE * 30)) 秒)"
            echo "[REVIEW_REQUEST_FAIL] 応答 format が変わった可能性があります。未知の反応は"
            echo "[REVIEW_REQUEST_FAIL] 安全側 (未取得扱い) へ倒すため red にしています。marker は"
            echo "[REVIEW_REQUEST_FAIL] src/check-ci-coderabbit/src/markers.rs と対で管理しています。"
            exit 1
          fi
          echo "[REVIEW_REQUEST_FAIL] 要求 (comment id=${SINCE_ID}) 後に CodeRabbit が反応しません ($((DEADLINE * 30)) 秒)"
          echo "[REVIEW_REQUEST_FAIL] 投稿者 identity が bot に戻っていないか (PAT の失効 →"
          echo "[REVIEW_REQUEST_FAIL] GITHUB_TOKEN へのフォールバック等)、CodeRabbit 側の"
          echo "[REVIEW_REQUEST_FAIL] 仕様変更、レート上限のいずれかを疑うこと。"
          exit 1
