# hooks-config.toml — Python プロジェクト向けテンプレート

[pre_tool_validate]
blocked_patterns = [
  "default",
  "git",
  "jj-immutable",
  "jj-main-guard",
]

extra_protected_files = [
  "settings.local.json",
  "settings.local.json.template",
  "hooks-config.toml",
]

# 確認なしで実行してよいコマンドの追加 (ADR-086 決定 5)。既定の一覧に無いコマンドは実行前に
# 確認が出る。足したコマンドの削除の機能は読まないので、削除の経路が無いことを確かめてから足す
# (例: uv は `uv cache clean`、pip は `pip uninstall` でプロジェクトの外を消すので足さない)。
# 下の 3 つは確かめて足した: `ruff clean` と `pytest --cache-clear` は削除、mypy のレポート出力と
# `--cache-dir` は上書きとしてガードが読む。
allowed_commands = ["ruff", "pytest", "mypy"]

[post_tool_linter]

[[post_tool_linter.pipelines]]
extensions = ["py"]
steps = [
  { cmd = "ruff", args = ["check", "--fix", "{file}"], fix = true },
  { cmd = "ruff", args = ["format", "{file}"], fix = true },
  { cmd = "ruff", args = ["check", "{file}"], fix = false },
]

[stop_quality]
step_timeout = 120

[[stop_quality.steps]]
name = "py-lint"
cmd = "pnpm py-lint"

[[stop_quality.steps]]
name = "py-test"
cmd = "pnpm py-test"

[[stop_quality.steps]]
name = "py-test:e2e"
cmd = "pnpm py-test:e2e"

# ─── PostToolUse: PR モニター ───
# gh pr create / git push 検出後に CI + CodeRabbit を自動監視する。
# public リポジトリで CodeRabbit が有効な場合に設定してください。

