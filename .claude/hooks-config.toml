# hooks-config.toml — プロジェクト固有の hooks 設定
#
# このファイルは各 hook exe と同じディレクトリ (.claude/) に配置します。
# 設定ファイルが存在しない場合、各 hook はデフォルト動作にフォールバックします。

# ─── SessionStart: セッション ID 伝播 ───
#
# SessionStart hook がセッション ID を以下に書き出す:
#   1. $CLAUDE_ENV_FILE → Bash ツールの環境変数 (CLAUDE_CODE_SESSION_ID)
#   2. .claude/.session-id → 子プロセス exe から読み取り可能
# 同一 ID ならスキップ、異なる ID なら上書きする方式。
# ※ cli-pr-monitor は daemon + state file 方式に移行済みのため
#   .session-id の直接参照は不要になったが、将来の拡張用に維持。

# [session_start]
# - staleness: 順位 136 案 A (試験運用、ADR-039 experimental pattern 準拠)。
#   `jj git fetch` で master を最新化し、`@-..master` の commit 数 (working copy
#   が遅れている分) を additionalContext に出力する。
#   3-5 PR の dogfood 後に default-ON 昇格 or 却下を判定 (bounded lifetime)。
#   Kill-switch: `enabled = false` で完全停止。
[session_start.staleness]
enabled = true
fetch_timeout_secs = 3        # jj git fetch 全体の timeout (network 異常で session 起動を阻害しない)
fetch_cache_secs = 300        # FETCH_HEAD mtime が N 秒以内なら fetch をスキップ (network cost 抑制)
default_branch = "master"     # trunk-based 前提、feature branch 運用では変更
# workspace stale 検知 nudge (ADR-045 § Known operational risks、C2)。並列 workspace の操作で
# working copy が stale になったら `jj workspace update-stale` を促す (自動実行はしない)。
# default-OFF (ADR-039 § 1)、本リポジトリは並列 workspace 運用のため有効化して dogfood。
stale_check_enabled = true

# [session_start.weekly_review_reminder]
# - ADR-031 Phase C / ADR-070: weekly-review の**監査リマインダー** (試験運用、ADR-039 準拠)。
#   ADR-070 で分析の主経路が cloud routine (週 1 schedule) へ移り、本 reminder は
#   「レビューを実行せよ」から「routine の稼働と結果の取り込みを確認せよ」へ転換した。
#   2 経路で発火:
#     1. `.claude/weekly-review-last-run.json` の `last_run_at` が `reminder_threshold_days` 超過
#     2. `.claude/weekly-reviews/*.md.failed` marker 1 件以上残存 (前回ローカル実行の失敗 resume)
#   両方該当する場合は 1 nudge にまとめて出力。
#   **重要**: last_run_at は skill の**ローカル実行時**にのみ更新される。cloud routine は
#   使い捨てクローンで動くため更新しない = 本 reminder は routine の実行を観測できない。
#   発火は「routine が止まっている」の証拠ではなく定期監査の促し。
#   Kill-switch: `enabled = false` で完全停止。
[session_start.weekly_review_reminder]
# 試験運用元 (本リポジトリ) では明示的に enable して reminder を実発火させる運用。
# ADR-031 は 2026-06-01 で本採用化済み、Phase E 観測で「reminder 未発火 = silent」だった
# 問題に対処するため試験運用元での enable に切替 (2026-06-23、PR-1)。
# 派生プロジェクト deploy 時は default OFF (ADR-039 § 1 opt-in 契約) を維持。
# 次 PR (PR-3) で `[features].enabled` allow-list 方式に移行予定 = 本 `enabled = true` は暫定。
enabled = true
# 7 日は**恒久設定**であり暫定値ではない (2026-08-13 ユーザー判断で確定)。週次レビューは
# 毎週実行すること自体に意味があり、「weekly」を冠する運用の reminder が月周期で鳴るなら
# それはもう週次運用ではない。ADR-070 は routine 移行時に一度 30 日 (監査サイクル) へ寄せ、
# 2026-08-12 に 7 日へ差し戻したが、当時は「デリバリ確立後に 30 日へ再引き上げを再評価」と
# いう条件付き措置として記録していた。その条件は撤回し、ローカル reminder は恒久的に
# 週次サイクルで鳴らす (ADR-070 決定 2 改訂、Rust 側 code default も 7 に一致させた)。
#
# **monthly_review_reminder.threshold_days (28) とは独立の変数**。キー名も section も別で、
# 片方の変更をもう片方へ波及させないこと。旧 code default 30 は monthly の 28 と近く混同を
# 招いたため、独立性は weekly_review.rs の
# default_threshold_is_weekly_and_independent_from_monthly が回帰テストで固定している。
reminder_threshold_days = 7
failed_marker_check_enabled = true # 前回ローカル実行の失敗 marker 検出 → resume promote。false で staleness のみに限定可
# ADR-059 (採用 2026-08-12): reminder 発火時に systemMessage (ユーザー可視 1 行) を
# additionalContext と併せて出し、「発火しているのにユーザーに見えない」silent 化を解消する。
# 判定確定: CLI はプロンプト前に描画する / VSCode 拡張は描画せず additionalContext の
# defense-in-depth (モデルによる冒頭言及) が代替する (2026-08-12 運用観測、ADR-059 § 確定判定)。
# source default OFF (派生 repo deploy 時は本行を置かない = additionalContext のみの従来挙動)。
# systemMessage のみ止めたい場合は false (additionalContext の nudge は継続)。
# reminder 自体の停止は上の enabled = false。
system_message_enabled = true

# [session_start.monthly_review_reminder]
# - ADR-062 (WP-12 step 2/3): `/monthly-review` skill 起動の reminder (試験運用、ADR-039 準拠)。
#   1 経路で発火 (weekly と異なり failed marker 経路は持たない、設計決定 1):
#     `.claude/monthly-review-last-run.json` の `last_run_at` (内容 timestamp。mtime ではない
#     — ADR-031 silent-fresh 教訓 / ADR-045 で main-root canonical 化) が `threshold_days`
#     (既定 28) を超過したら telemetry ROI 棚卸しの `/monthly-review` 実行を促す。
#   dogfood 3 回で default-ON 昇格 or 却下を判定 (bounded lifetime、ADR-062)。
#   Kill-switch: `enabled = false` で完全停止。
[session_start.monthly_review_reminder]
# 試験運用元 (本リポジトリ) では明示的に enable して reminder を実発火させる運用。
# 派生プロジェクト deploy 時は default OFF (ADR-039 § 1 opt-in 契約) を維持
# (code default は unwrap_or(false)、本行を置かなければ完全 skip)。
enabled = true
threshold_days = 28                # ADR-053/061 の撤去粒度「4 週間」と整合 (月次粒度)
# ADR-059 (採用 2026-08-12): reminder 発火時に systemMessage (ユーザー可視 1 行) を additionalContext と
# 併せて出す。判定確定: CLI は描画 / VSCode 拡張は非描画で additionalContext の defense-in-depth が代替
# (本 reminder の運用観測が判定根拠。ADR-059 § 確定判定)。source default OFF。systemMessage のみ
# 止めたい場合は false (additionalContext の nudge は継続)。reminder 自体の停止は上の enabled = false。
system_message_enabled = true

# ─── PreToolUse: コマンド検証 ───

[pre_tool_validate]
# ブロックパターンのプリセット名を指定
#   "default"       — rm -rf, cd /d (ほぼ全プロジェクト共通)
#   "git"           — git コマンドブロック (jj 利用プロジェクト向け)
#   "jj-immutable"  — jj --ignore-immutable
#   "jj-main-guard" — jj new main / jj edit main
#   "jj-push-guard" — jj git push / jj push 禁止 (pnpm push に誘導)
#   "gh-pr-merge-guard" — gh pr merge ブロック (pnpm merge-pr に誘導)
#   "polling-anti-pattern" — until/while ! ... sleep の polling ループをブロック
#                              (rate-limit 浪費防止、PR #86 T1-1)
#   "exe-help-block" — 本リポジトリの Rust 製 exe (.claude/*.exe) + 単独 --help/-h/?
#                              をブロックして src/<exe-name>/src/main.rs Read に誘導
#                              (PR #109 SIGPIPE 事故の直接 trigger を構造的に防止、順位 65 / Bundle c)
#   "electron"      — Electron GUI 実行ブロック
#   "jj-message-required" — jj new / jj split を -m / --message なしでブロック
#                              (混合 commit 事故 + jj split editor hang を構造的に防止、
#                               順位 144 / PR #171 T3-#8 採用)
#   "secret-detection" — AWS / OpenAI / GitHub / Anthropic 等の hardcoded secret を
#                              Bash command + Edit/Write content 双方で検出してブロック
#                              (~/.claude/rules/common/security.md § Secret Management 移管、
#                               順位 146 / PR #200 follow-up 採用、Tier 1 default-on)
#   "gh-repo-env-guard" — GH_REPO 環境変数の場当たり使用をブロックし GIT_DIR /
#                              自動注入 / --repo フラグに誘導 (GH_REPO は引数なし
#                              gh repo view に効かず非 colocated jj workspace で
#                              silent 部分故障を招く、PR #238 実例 / ADR-045)
# プリセット名以外の文字列は正規表現としてカスタムパターン扱い
blocked_patterns = [
  "default",
  "git",
  "jj-immutable",
  "jj-main-guard",
  "jj-push-guard",
  "gh-pr-create-guard",
  "gh-pr-merge-guard",
  "polling-anti-pattern",
  "exe-help-block",
  "electron",
  "jj-message-required",
  "secret-detection",
  "gh-repo-env-guard",
]

# 追加の保護ファイル (デフォルトリストに追加)
extra_protected_files = []

# 順位 136 案 B (試験運用、ADR-039 experimental pattern 準拠)。
# Edit/Write の対象が docs/todo*.md 系列のとき、master と @- の lineage 確認
# (stale 検知) + ### 見出し title からの keyword grep (既実装 commit 提示)。
# stale 検知時は exit 2 で block、grep のみ hit は exit 0 + stderr 出力 (warn-only)。
# 3-5 PR の dogfood 後に default-ON 昇格 or 却下を判定 (bounded lifetime)。
[pre_tool_validate.todo_staleness]
enabled = true
default_branch = "master"       # trunk-based 前提、feature branch 運用では変更
grep_recent_limit = 20          # jj log で参照する直近 commit 数

# ─── PostToolUse: カスタムリンター ───
# プロジェクト固有のカスタムルールは custom-lint-rules.toml に定義。
# 正規表現ベースのリテラルマッチのみ。AST解析が必要なルールは
# ast-grep を下記パイプラインのステップとして追加する (ADR-007)。

# ─── PostToolUse: ファイルサイズチェック ───
# 順位 177 (PR #197 で Tier 1 (優先実装) 格上げ) で実装。
# PostToolUse Edit/Write 直後にファイルサイズを確認し、threshold (50KB) 超過時に
# additionalContext でファイル分割を促す。Claude Code 読み取り安定性閾値 (50KB) を
# 機械強制する custom linter。
#
# ADR-039 § 1.b mechanical lint 例外で default ON (PR #203 で訂正、本 PR で適用):
#   - 失敗 mode が non-blocking (additionalContext warning のみ、ブロックしない)
#   - 判定が決定論的 (50KB 固定閾値、discretionary 判断なし)
#   - 適用 scope が宣言的に限定 (paths glob)
#   - recovery hint が明確 (todo*.md なら新 todo<N+1>.md を新設して移管)
# 同類例: 順位 147 file_length lint (hooks-post-tool-comment-lint-rust) も default ON 固定。
#
# touch-trigger ratchet (default true): 触られたファイルのみチェック = 既存超過
# ファイルは未編集なら grandfather。strict mode (touch_trigger=false で全 enabled
# paths を scan) は MVP では受理のみ。
#
# Kill-switch: enabled = false で完全停止。
[post_tool_use.file_size_check]
enabled = true                                   # ADR-039 § 1.b mechanical lint 例外 (non-blocking + 決定論 + scope 限定 + recovery hint 明確)
threshold_bytes = 51200                          # 50KB (= 50 * 1024)、Claude Code 読み取り安定性閾値
paths = ["docs/**/*.md", "src/**/*.rs"]          # default 対象 glob
touch_trigger = true                             # 触られたファイルのみ check (ratchet)

# jj operation 検証 (ADR-045 § Operation Verification Checklist の自動化、G案)。
# Bash tool で変更系 jj コマンド (new/describe/abandon/rebase/squash/bookmark 変更系) を
# 実行した直後に `jj op log --limit 1` で operation の記録を確認し、無ければ
# 「operation not recorded」警告を additionalContext で返す (non-blocking 助言層)。
# 2026-07-12/13 の並列 workspace lost-update incident の検出網。
# default-OFF (ADR-039 § 1)、本リポジトリは並列 workspace 運用のため有効化して dogfood。
# Kill-switch: enabled = false で完全停止。
[post_tool_use.jj_op_verify]
enabled = true

# ─── PostToolUse: リンター ───

[post_tool_linter]

[[post_tool_linter.pipelines]]
extensions = ["ts", "tsx", "js", "jsx"]
steps = [
  { cmd = "npx", args = ["--no-install", "biome", "format", "--write", "{file}"], fix = true },
  { cmd = "npx", args = ["--no-install", "oxlint", "--fix", "{file}"], fix = true },
  { cmd = "npx", args = ["--no-install", "oxlint", "{file}"], fix = false },
]

[[post_tool_linter.pipelines]]
extensions = ["py"]
steps = [
  { cmd = "ruff", args = ["check", "--fix", "{file}"], fix = true },
  { cmd = "ruff", args = ["format", "{file}"], fix = true },
  { cmd = "ruff", args = ["check", "{file}"], fix = false },
]

[[post_tool_linter.pipelines]]
extensions = ["md"]
steps = [
  { cmd = "npx", args = ["--no-install", "markdownlint-cli2", "--fix", "{file}"], fix = true },
  { cmd = "npx", args = ["--no-install", "markdownlint-cli2", "{file}"], fix = false },
]

# ─── tool call leak 検知 (ADR-053 / ADR-061、試験運用) ───
#
# ツール呼び出しが tool_use block ではなくテキスト領域に `<invoke ...>` XML として
# 出力され、実行されないまま turn が終了する不具合を検知する。単一 exe が
# hook_event_name で 2 経路に分岐する (settings.local.json.template で Stop と
# UserPromptSubmit の両方に登録):
#   - Stop (ADR-053): 末尾 leak を検知し block で再実行を促す。
#   - UserPromptSubmit (ADR-061 主因): 内部リトライも失敗して合成エントリ
#     (isApiErrorMessage:true / model:"<synthetic>") で turn がエラー終了する hard-fail
#     経路では Stop hook が発火しない。直後の UserPromptSubmit で取り逃がした leak を検知し、
#     非ブロッキングな additionalContext (+任意 systemMessage) で再実行を促す。
#
# ADR-039 3 点セット:
#   - Config opt-in (default OFF): 各機能の code default は false (unwrap_or(false))。
#     本 repo は dogfood のため有効化。派生プロジェクト deploy 時は default OFF。
#   - Kill-switch: 恒久停止は各 enabled = false。緊急バイパスは env
#     STOP_TOOL_CALL_LEAK_OVERRIDE=1 (truthy 値、両経路共通、FILE_LENGTH_CHECK_OVERRIDE と同 pattern)。
#   - Bounded lifetime: 根本原因は上流 (Claude Code / モデルのシリアライズ) の不具合。
#     上流修正の確認、または leak 4 週間非観測で ADR-053 とまとめて撤去を判定する。
#
# ループ防止 (Stop): stop_hook_active skip ではなく連続 leak カウント上限で fail-open
# (ADR-004 からの意図的逸脱、再 leak 実績があるため。詳細は ADR-053)。
[stop_tool_call_leak]
enabled = true
max_consecutive_blocks = 3    # 連続 block 上限 (到達で fail-open)
# ADR-061 主因: hard-fail 経路の取り逃がしを UserPromptSubmit で回収する層。
# code default OFF (prompt_recovery_enabled 未設定で無効)。本 repo は dogfood のため true。
prompt_recovery_enabled = true
# 回収時に systemMessage (ユーザー可視 1 行、ADR-059) を出す。source default OFF。
# systemMessage のみ止めたい場合は false (additionalContext の回収は継続)。
recovery_system_message_enabled = true

# ─── Stop: 品質ゲート ───

[stop_quality]
# 順位 175 (PR #185 T1-#1): cargo clippy 追加で Rust lint structural gap を補填。
# incremental cache が効く限り 5-15s で完了するため step_timeout=60 内に収まる。
# cold cache の初回のみ超過リスクあり (workspace 全 crate compile)。
step_timeout = 60

[[stop_quality.steps]]
name = "lint"
cmd = "pnpm lint"

[[stop_quality.steps]]
name = "lint:md"
cmd = "pnpm lint:md"

[[stop_quality.steps]]
name = "lint:rust"
cmd = "cargo clippy --workspace -- -D warnings"

[[stop_quality.steps]]
name = "test"
cmd = "pnpm test"

[[stop_quality.steps]]
name = "test:e2e"
cmd = "pnpm test:e2e"

[[stop_quality.steps]]
name = "build"
cmd = "pnpm build"

# 順位 147 / PR-W5: file-length Stop gate (旧 file-length-enforcement-plan、
# 2026-08-12 完了・削除。分割制約は docs/dev-conventions.md § Rust ファイル分割の制約条件 へ移設)。
# PR 範囲 (base branch..@) の .rs file が 800 行超なら Stop を block する強制層。
#
# cmd は OS のシェル経由で実行される (Windows: cmd.exe / Linux: sh、WP-15)。
# 両シェルで共通に解決できるのは **forward-slash の絶対パス**だけなので
# (cmd.exe は forward-slash 相対を、sh は backslash を解決できない = 実測)、
# hooks-stop-quality が展開する 2 つのプレースホルダーで書く:
#   {{CLAUDE_DIR}} → .claude/ の絶対パス (forward-slash 正規化)
#   {{EXE_SUFFIX}} → .exe (Windows) / 空文字 (Linux)
# gate の有効化は下記 [file_length_gate] enabled で制御 (この step があっても
# enabled = false なら exe は即 exit 0 で no-op)。
[[stop_quality.steps]]
name = "file-length"
cmd = '{{CLAUDE_DIR}}/hooks-post-tool-comment-lint-rust{{EXE_SUFFIX}} --check-modified-files'

# ─── PR-W5: file-length Stop gate 設定 (ADR-039 experimental feature 標準パターン) ───
#
# hooks-post-tool-comment-lint-rust.exe --check-modified-files が参照する opt-in gate。
# 上の [[stop_quality.steps]] "file-length" step から起動される。
#
# ADR-039 3 点セット:
#   - Config opt-in (default OFF): code default は enabled = false (unwrap_or(false))。
#     本 repo は Phase 1 (PR-W1〜W4) の clean state を dogfood するため enabled = true。
#   - Kill-switch: 恒久停止は enabled = false。緊急バイパスは env
#     FILE_LENGTH_CHECK_OVERRIDE=1 (truthy 値、順位 151 pr_size_check と同 pattern)。
#   - Bounded lifetime: 本採用 (2026-08-12)。削除条件 1-3 (PR-W0〜W5 全マージ
#     #219/#220/#224/#230/#231/#234 / 800 行超 .rs 0 件 (2026-08-12 実測) /
#     OVERRIDE 未使用 6 週間 (land 2026-07-02 から全 push が gate 通過)) の
#     充足を確認して計画書を削除した。
#
# base: PR 範囲算出の base branch (省略時 "master"、ADR-021 § Revset Composability で引数化)。
[file_length_gate]
enabled = true

# ─── Push Pipeline: push-runner-config.toml に移行済み (ADR-015) ───
#
# pnpm push は cli-push-runner.exe (takt ベース) を使用。
# 設定はリポジトリルートの push-runner-config.toml を参照。
# PreToolUse の "jj-push-guard" プリセットにより直接の jj git push はブロックされ、
# pnpm push を通すことが強制される。

# ─── Merge Pipeline: PR マージ + ローカル同期 ───
#
# pnpm merge-pr で起動されるパイプライン。
# PreToolUse の "gh-pr-merge-guard" プリセットにより直接の gh pr merge はブロックされ、
# このパイプラインを通すことが強制される。
#
# 処理フロー:
#   1. jj bookmark から PR を自動検出
#   2. pre_steps を順次実行（マージ前チェック）
#   3. gh pr merge --squash --delete-branch を実行
#   4. jj git fetch && jj new master でローカル同期
#   5. post_steps を順次実行（学び提案等）

[merge_pipeline]
step_timeout = 120
default_branch = "master"  # "main" など、リポジトリに合わせて変更

# マージ前チェック
# [[merge_pipeline.pre_steps]]
# name = "ci_check"
# type = "command"
# cmd = "gh pr checks --required"

# マージ後のフィードバックループ自動起動 (ADR-029 試験運用)
# cli-merge-pipeline が .claude/post-merge-feedback-pending.json を書き込み、
# hooks-stop-feedback-dispatch が検出して /post-merge-feedback skill を起動する。
[[merge_pipeline.post_steps]]
name = "post_merge_feedback"
type = "ai"
prompt = "post-merge-feedback"

# (旧 [post_pr_monitor] セクションは WP-17 PR 3 で撤去 — daemon + CronCreate ポーリング
#  時代 (ADR-009) の残骸で、どのコードも読んでいなかった。現行の PR 監視設定は
#  リポジトリルートの pr-monitor-config.toml が正)

# ─── 発火テレメトリ収集層 (WP-12 step 1、ADR-055、試験運用) ───
#
# 各 hook が block/warn を発火したイベント (rule / preset / hook) を lib-telemetry が
# .claude/telemetry/firings-<YYYY-MM-DD>-<pid>.jsonl に append する。ハーネス複雑度
# (custom rule / preset / hook) の維持判断を発火実績で機械化する ROI 棚卸しの収集層。
# 記録はメタデータのみ (hook / kind / id / decision / timestamp、任意 session_id)。
# ファイルパス・編集内容・コマンド本文は記録しない (custom rule ② no-personal-paths の思想)。
#
# ADR-039 3 点セット:
#   - Config opt-in (default OFF): code default は unwrap_or(false)。section 省略で OFF。
#     本 repo は dogfood のため enabled = true。派生プロジェクト deploy 時は section 省略で OFF。
#   - Kill-switch: 恒久停止は enabled = false。緊急バイパスは env CLAUDE_TELEMETRY_DISABLE=1
#     (truthy 値、受理集合 1|true|yes|on)。
#   - Bounded lifetime: 収集開始から 28 日 warm-up 後に WP-12 step 2 (集計 pre-step) で
#     「発火 0 の rule/preset/hook を削除候補提示」→ step 3 (ADR-039 卒業/廃止の発火数機械化)。
#
# fail-open: 記録は observation 層でありゲートではない。書き込み失敗・config 欠落は黙って
# 握りつぶし、hook 本来の block/allow 判定を妨げない (ADR-043 の fail-closed はゲート限定)。
[telemetry]
enabled = true

# ─── 月次ハーネス ROI レビュー集計 (WP-12 step 2/3、ADR-062、試験運用) ───
#
# cli-telemetry-report (`pnpm telemetry-report`) が読む設定。各 workspace root の
# firings-*.jsonl を横断集計し月次 rollup (.claude/telemetry/monthly-<YYYY-MM>.json) を
# main workspace 側に確定、レポート (.claude/monthly-reviews/<YYYY-MM-DD>.md + JSON) を出力する。
# 発火 0 の機構を洗い出し、下記 mechanism マッピングで非アクティブ化判定候補を提示する
# (自動無効化はしない。採否は /monthly-review skill の AskUserQuestion を経る、ADR-022/028)。
#
# ADR-039 3 点セット (収集層 [telemetry] とは別レイヤーの opt-in):
#   - Config opt-in: section 省略 = レポート生成のみ。retention (削除系) は retention_days
#     未設定で無効 (default OFF)。本 repo は dogfood のため retention_days を設定。
#   - Kill-switch: section 削除で本集計を停止 (収集層 [telemetry] とは独立)。
#   - Bounded lifetime: 初回有意義な実行は収集開始 (2026-07-15) + 28 日 = 2026-08-12 以降。
#     dogfood 3 回で採否判定 (ADR-062)。
#
# root 発見が不完全 (jj workspace list 失敗 / 現 workspace 以外の未解決 / extra_roots 到達不能)
# な実行では判定候補の promote を抑止する (発見漏れ + 発火 0 の誤 promote 防止)。
# extra_roots: jj workspace list で自動解決できない workspace を絶対パスで補う。machine 固有の
# ため本 (tracked) config には置かず、必要な環境で settings ローカルに追記する運用。
[telemetry_report]
retention_days = 90            # 90 日超過の raw firing partition を削除 (rollup 確定後のため判定に影響なし)
zero_streak_months = 2        # 連続 2 か月発火 0 で非アクティブ化候補として promote (ユーザー決定事項 1)
trend_months = 6              # レポートが遡る月数 (月別表 / 発火 0 リストの窓)
# extra_roots = ["C:\\path\\to\\other-workspace"]  # 環境ごとに必要なら有効化

# 機構レジストリ (設計決定 1、Phase A)。発火 0 リストの母集合を「窓内 rollup に現れた id」から
# 「全機構」に拡張する。rule (custom-lint-rules.toml の全 rule id) と preset ([pre_tool_validate]
# blocked_patterns) は exe が自動列挙するため、自動列挙元が無い hook / nudge 発火 id のみここに静的
# 列挙する。id は hook 名と一致しない例がある (各 hook の lib_telemetry::record 呼び出しで実確認):
#   file-length                                = hooks-post-tool-comment-lint-rust (file-length gate)
#   hooks-stop-tool-call-leak                  = leak 検知 Stop 経路 (block)
#   hooks-stop-tool-call-leak/prompt-recovery  = leak 回収 UserPromptSubmit 経路 (warn、ADR-061)
#   jj-op-verify                               = hooks-post-tool-jj-op-verify (operation 未記録 warn)
#   hooks-stop-quality                         = Stop 品質ゲート (block)
#   reaper / staleness / workspace_stale / weekly_review_reminder /
#   monthly_review_reminder                    = hooks-session-start の nudge 群 (warn)
#   (pr_monitor_catchup は WP-17 PR 3 で nudge ごと撤去 — 過去の firings jsonl には残るが
#    集計対象の現役 id ではない)
[telemetry_report.registry]
hook_ids = [
  "file-length",
  "hooks-stop-tool-call-leak",
  "hooks-stop-tool-call-leak/prompt-recovery",
  "jj-op-verify",
  "hooks-stop-quality",
  "reaper",
  "staleness",
  "workspace_stale",
  "weekly_review_reminder",
  "monthly_review_reminder",
]

# 初期マッピング 1 件: ADR-053/061 の tool call leak 検知。監視 2 id が連続発火 0 かつ各月
# enabled+配備済みなら非アクティブ化候補として提示する (crate 撤去 revert PR は ADR-053/061
# bounded lifetime 手順に従う)。全試験運用 ADR の網羅登録は将来拡張。
[[telemetry_report.mechanisms]]
name = "stop_tool_call_leak"
adr = "ADR-053/061"
ids = ["hooks-stop-tool-call-leak", "hooks-stop-tool-call-leak/prompt-recovery"]
enabled_config_keys = ["stop_tool_call_leak.enabled", "stop_tool_call_leak.prompt_recovery_enabled"]
exe_names = ["hooks-stop-tool-call-leak"]
proposal = "[stop_tool_call_leak] enabled = false + prompt_recovery_enabled = false（最終的な crate 撤去 revert PR は ADR-053/061 bounded lifetime 手順に従う）"
