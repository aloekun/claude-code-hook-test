# cargo-nextest の設定 (CI の rust job と push-runner の rust-lint-test group が使う。
# ADR-065 § 追記 2026-11-18)。
#
# nextest はテストを 1 件ずつ別のプロセスで走らせる。cwd や環境変数を変えるテストも
# プロセスごとに分かれるので、`cargo test -- --ignored --test-threads=1` のように
# 全体を直列にしなくてよい。
#
# 版は 0.9.152。次の 3 箇所で揃える (論理結合、ADR-051):
#   - CI: .github/workflows/ci.yml の install-action
#   - クラウド: scripts/cloud-setup.sh の NEXTEST_VERSION
#   - 手元: `cargo install cargo-nextest --locked --version 0.9.152`
# 一致は scripts/nextest-parity.test.mjs が検査する (push-runner と CI のコマンドの一致も同じテスト)。

# push-runner (手元) が使う。1 件目の失敗で止め、push の待ち時間を短くする。
[profile.default]
# ハングしたテストを打ち切り、名前を出す。60 秒ごとに SLOW と表示し、5 回目 (300 秒) で止める。
# 最も遅いテストでも 30 秒に届かないので、正常なテストを止めることはない。
slow-timeout = { period = "60s", terminate-after = 5 }

# CI が使う。default を引き継ぎ、失敗しても止めずに壊れたテストを全部出す。
[profile.ci]
fail-fast = false
