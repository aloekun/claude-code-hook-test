# autonomy-config.toml -- 自律実行の全体 kill-switch (ADR-066 / WP-17 PR 1)
#
# cli-autonomy-gate.exe がこのファイルを読み、外部フラグ (env AUTONOMY_ENABLED) との
# AND で「自律 actor が ADR-052 自動実行可クラスの操作を行ってよいか」を判定する。
# 読み取り先は呼び手が --config で明示指定する (既定パス推測はしない)。
#
# ---------------------------------------------------------------------------
# なぜ専用ファイルなのか (pr-monitor-config.toml へ相乗りしない理由)
# ---------------------------------------------------------------------------
# 1. 本フラグは cli-pr-monitor 専用ではない。Phase B の無人 fix push・夜間 todo 消化
#    ループ (WP-18)・cloud routine が共通で参照する横断フラグである。
# 2. CI からは「master ref から取り出した写し」を読ませる必要がある (下記)。専用の
#    小さいファイルにしておくと、その抽出が 1 パスで済み workflow 側で監査しやすい。
# 3. toml の parse 失敗は本 exe では fail-closed (= 自律停止) に倒れる。相乗りすると
#    無関係な section の typo が自律動作を止めるため、blast radius を分離する。
#
# ---------------------------------------------------------------------------
# 信頼境界 (CI から読む場合の必須事項)
# ---------------------------------------------------------------------------
# GitHub Actions から参照する場合、本ファイルは **master ref の写し** でなければならない。
# PR ブランチの checkout をそのまま読ませると、自律 actor 自身 (または prompt injection を
# 受けた fix エージェント) が claude/ ブランチ上で enabled = true に書き換えて自己解除できる
# (ADR-054 が塞いだ信頼境界と同型)。CI 側の権威は admin のみ書き込める Actions variable
# AUTONOMY_ENABLED で、本ファイルはリポジトリ側の意思表示として AND される。
#
# ---------------------------------------------------------------------------
# 極性と停止手順 (ADR-052 原則 5 / ADR-039)
# ---------------------------------------------------------------------------
# 正極性の単一フラグ。存在しかつ true のときだけ有効で、以下はすべて「停止」に倒れる:
#   - ファイルが無い / 読めない / toml parse 失敗
#   - [autonomy] section が無い / enabled キーが無い
#   - enabled = false
#   - enabled が bool 以外 (例 "true" と文字列で書いた場合)
# 恒久停止は enabled = false。緊急停止は CI 側の Actions variable AUTONOMY_ENABLED を
# 削除する (ADR-060 の CLOUD_HARNESS と同じ「変数削除 = 停止」の操作反射)。
# *_DISABLE 形式の負極性 env は本機構には存在しない — 未定義が「許可」に倒れる向きの
# フラグを混ぜないことが本設計の要点 (ADR-066 § 負極性を退けた根拠)。
#
# 派生プロジェクトへは配布しない。ファイルが無ければ自動的に停止 = 安全側 default。

[autonomy]
# WP-17 PR 2 で true へ倒した。呼び手 (pr-monitor.yml の Phase B fix job) が実装され、
# リポジトリとしては自律 fix push を許可する意思表示をした状態。
#
# ただし判定は本フラグと外部フラグ (Actions variable AUTONOMY_ENABLED、'true' ちょうど) の
# AND なので、本フラグ単独では Phase B は動かない。variable の設定・削除は admin (リポジトリ
# 所有者) だけが行え、現在値は Settings → Secrets and variables → Actions → Variables が正。
# 本コメントに variable の設定状態は書かない — 外部 SaaS 側の実状と config 内の記述が
# 食い違う drift を避ける (ADR-051 のクロスシステム coupling 規律)。
#
# 停止する場合: 恒久停止は本行を false へ、緊急停止は Actions variable を削除する。
enabled = true

# ---------------------------------------------------------------------------
# 背圧: 未マージ draft PR 数の上限 (ADR-071 / WP-18 PR 1、ADR-052 原則 5 の契約)
# ---------------------------------------------------------------------------
# 自律 actor が draft PR を作る前に、`claude/` prefix の未マージ draft PR を数え、
# **この件数以上なら停止する** (>= 判定)。上の enabled が「動いてよいか」を決めるのに対し、
# 本値は「もう十分積んだので今夜は作らない」という自主減速を決める。
#
# 極性と欠損時の挙動は enabled と同じ「欠損 → 停止」:
#   - キーが無い / 型が違う (文字列・負値・小数) → 背圧未接続として draft PR を deny
#   - 実測件数を取得できなかった場合も deny (呼び手が数を渡せなければ停止)
# 既定値へ倒さないのは、書き忘れが「勝手に 3 件まで作る」へ倒れないようにするため。
#
# なお本キーが型違いだと toml の parse がファイル単位で失敗し、上の enabled も読めなくなる
# = 自律動作が全停止する。config が半壊した状態で「kill-switch だけ有効」と読ませないための
# 意図した挙動で、編集後は `pnpm autonomy-status` で読めていることを確認すること。
#
# 0 を指定すると「draft PR を 1 件も作らない」= draft-pr クラスだけの停止になる
# (fix push は本値の影響を受けない。fix push の背圧は cli-pr-monitor の有界 retry が担う)。
#
# 初期値 3 の根拠: 人間のレビュー待ち行列として 3 件が「1 セッションで捌ける上限」の見積り。
# 稼働後の実績 (採用率・滞留時間) で見直す (ADR-071 § 試験運用判断基準)。
max_open_draft_prs = 3
