name: weekly-review
description: >
  プロジェクト全体を対象にした週次レビュー workflow (ADR-031)。
  既存 3 パイプライン (pre-push-review / post-pr-review / post-merge-feedback)
  が見ない whole-tree 観点 (累積複雑度 / 横断的 ADR 整合性 / ハーネス遵守 /
  test 設計) を補完する。
  5 つの whole-tree review facet (simplicity / security / architecture / todo / jj-robustness)
  と決定論的 scan 2 つ (file-size / workspace-hygiene) を parallel で走らせて
  aggregate-weekly が findings JSON + markdown を生成する。post-merge-feedback.yaml の構造を流用。
  fix loop なし: コードではなく findings レポートを生成するため
  reviewers/fix の構造は不要。
  出力: weekly-review.md + findings.json (Report Directory に保存)
  Phase C skill `/weekly-review` が findings.json を読んで AskUserQuestion で
  採否を確認、採用分を docs/todo*.md に展開する。

workflow_config:
  provider_options:
    claude:
      network_access: false
    codex:
      network_access: false
    opencode:
      network_access: false

max_steps: 10
initial_step: reviewers

steps:
  # ---------------------------------------------------------------------------
  # Step 1: reviewers (parallel)
  #   5 つの whole-tree review facet (simplicity / security / architecture / todo /
  #   jj-robustness) と決定論的 scan 2 つ (file-size / workspace-hygiene) を並列実行する。
  #   各 review facet は独立した観点でソースツリー / todo corpus を Glob/Read/Grep し、
  #   findings を articulate する。
  #   Report Directory には simplicity-whole-review.md / security-whole-review.md /
  #   architecture-whole-review.md / review-todo-whole.md / review-jj-robustness-whole.md /
  #   file-length-watchlist.md / workspace-hygiene-scan.md が並ぶ。
  # ---------------------------------------------------------------------------
  - name: reviewers
    parallel:
      # 観点 ⑥ テストロジック (TDD anti-pattern + 境界欠落) を criteria 筆頭、
      # 累積複雑度 / dead code / overspec'd abstraction を補助観点。
      - name: simplicity-whole-review
        edit: false
        persona: simplicity-reviewer
        model: haiku
        policy: review
        provider_options:
          claude:
            allowed_tools:
              - Read
              - Glob
              - Grep
        instruction: review-simplicity-whole
        output_contracts:
          report:
            - name: simplicity-whole-review.md
              format: simplicity-whole-review
        rules:
          - condition: analysis complete

      # 観点 ④ セキュリティ。whole-tree 限定の発見 = 機密漏出 pattern /
      # 横断的 prompt injection surface / asymmetric guard coverage。
      - name: security-whole-review
        edit: false
        persona: security-reviewer
        model: haiku
        policy: review
        knowledge: security
        provider_options:
          claude:
            allowed_tools:
              - Read
              - Glob
              - Grep
        instruction: review-security-whole
        output_contracts:
          report:
            - name: security-whole-review.md
              format: security-whole-review
        rules:
          - condition: analysis complete

      # 観点 ① ハーネス遵守 (rule/pipeline/hook 重複) を criteria 筆頭、
      # 観点 ② docs 内整合性 + ③ docs-source 矛盾 を sub criterion で組込。
      # ADR 整合性 / モジュール境界 / ADR-012 命名 / 循環依存 / レイヤ侵犯。
      - name: architecture-whole-review
        edit: false
        persona: architecture-reviewer
        model: haiku
        policy: review
        knowledge: architecture
        provider_options:
          claude:
            allowed_tools:
              - Read
              - Glob
              - Grep
        instruction: review-architecture-whole
        output_contracts:
          report:
            - name: architecture-whole-review.md
              format: architecture-whole-review
        rules:
          - condition: analysis complete

      # 観点 ⑦ file size watchlist (PR-W0 拡張、順位154)。edit-time の 順位147 lint /
      # PR-W5 [file_length_gate] は「触られた/PR範囲の file」のみ対象で、未触り state の
      # 全件棚卸しと docs/todo*.md の 50KB 分割 trigger は対象外。本 step が週次 1 回
      # master HEAD を deterministic に scan (`.rs` 800 行 + `todo*.md` 50KB) し、
      # aggregate-weekly が watchlist に統合する。
      # 純機械 (LLM 判断ゼロ、Bash 出力を転記するだけ)。takt は全 step に persona を
      # 必須とするため persona 指定は構造要件であり判断を意味しない (WR-2026-07-01-C01 解消)。
      - name: file-length-watchlist
        edit: false
        persona: simplicity-reviewer
        model: haiku
        policy: review
        provider_options:
          claude:
            allowed_tools:
              - Bash
              - Read
        instruction: file-length-watchlist
        output_contracts:
          report:
            - name: file-length-watchlist.md
              format: file-length-watchlist
        rules:
          - condition: analysis complete

      # 観点 ⑨ workspace hygiene (2026-08-14 追加)。root 直下の想定外ファイル (allowlist
      # 突合) + scratch pattern (__* / _tmp_*) whole-tree + ignored 資産サイズの週次棚卸し。
      # push 時 scratch 検査 ([scratch_file_warning] stage) は push 時のみ・pattern 合致のみで、
      # push 後に生成された非 pattern ファイル (2026-08-14 の analyze_transcript.py 実観測) を
      # 捕まえられない。jj auto-snapshot が新規ファイルを即 commit に取り込むため、週次の
      # 回収網として本 step を置く。file-length-watchlist と同じ純機械 step (LLM 判断ゼロ、
      # persona は takt の構造要件)。削除は提案止まり、実行は Phase 3 でユーザーが決める (ADR-022)。
      - name: workspace-hygiene-scan
        edit: false
        persona: simplicity-reviewer
        model: haiku
        policy: review
        provider_options:
          claude:
            allowed_tools:
              - Bash
              - Read
        instruction: workspace-hygiene-scan
        output_contracts:
          report:
            - name: workspace-hygiene-scan.md
              format: workspace-hygiene-scan
        rules:
          - condition: analysis complete

      # 台帳未掲載の順位の全件列挙 (2026-08-17 追加、ADR-072 決定 18)。
      # 従来は review-todo-whole facet (haiku) に「全順位を判定せよ」と指示文だけで
      # 強制していたが 2 週連続で失敗した (164 件中約 50 件 / 251 件中 13 件しか判定せず
      # いずれも「候補 0 件」と報告)。件数を数えるのは機械の仕事なので決定論層へ戻す。
      # file-length-watchlist / workspace-hygiene-scan と同じ純機械 step。
      # **判定はしない** — どれを台帳へ載せるか、lane を ✅ / — のどちらにするかは
      # 人間の割り当て判断 (ADR-022 / ADR-072 決定 18)。本 step は材料を出すだけ。
      - name: ledger-candidates
        edit: false
        persona: architecture-reviewer
        model: haiku
        policy: review
        provider_options:
          claude:
            allowed_tools:
              - Bash
              - Read
        instruction: ledger-candidates
        output_contracts:
          report:
            - name: ledger-candidates.md
              format: ledger-candidates
        rules:
          - condition: analysis complete

      # 観点 ⑤ Todo 妥当性 (ADR-031 拡張、順位154)。docs/todo*.md 全 corpus の
      # dead pattern / cross-file 重複 / preamble routing drift を週次 batch で棚卸し。
      # 順位136 hook (編集時 immediate) / cli-docs-lint が拾えない経年・横断的劣化を補完。
      # 2026-08-06 (WP-18 PR 2): docs/claude-code-web-tasks.md の鮮度検査を追加。同台帳は
      # 夜間 todo 消化ループのタスク選択元で、stale な 無人可 マークが無人 agent の重複実装を
      # 招く。台帳の lifecycle が本 step を定期棚卸しの場として指名している。
      - name: review-todo-whole
        edit: false
        persona: architecture-reviewer
        model: haiku
        policy: review
        provider_options:
          claude:
            allowed_tools:
              - Read
              - Glob
              - Grep
              - Bash
        instruction: review-todo-whole
        output_contracts:
          report:
            - name: review-todo-whole.md
              format: review-todo-whole
        rules:
          - condition: analysis complete

      # 観点 ⑧ jj-workspace robustness (ADR-031 拡張、順位247)。非 colocated / 並列 jj
      # workspace (ADR-045) で silent に壊れる mtime staleness / CARGO_MANIFEST_DIR 実行時
      # 読み / --repo 無し gh / colocated .git 前提 を whole-tree で検出。diff-local review
      # では見えない環境 fragility を補完 (2026-07 セッションで 4 bug class を実観測)。
      - name: review-jj-robustness-whole
        edit: false
        persona: architecture-reviewer
        model: haiku
        policy: review
        provider_options:
          claude:
            allowed_tools:
              - Read
              - Glob
              - Grep
              - Bash
        instruction: review-jj-robustness-whole
        output_contracts:
          report:
            - name: review-jj-robustness-whole.md
              format: review-jj-robustness-whole
        rules:
          - condition: analysis complete

    rules:
      - condition: all("analysis complete")
        next: aggregate-weekly

  # ---------------------------------------------------------------------------
  # Step 2: aggregate-weekly
  #   7 つの whole-tree レポート (5 review facet + file-length watchlist +
  #   workspace hygiene scan) を統合し、
  #   severity 順に並べた findings JSON + markdown を生成する。
  #   pass_previous_response: false で、Report Directory の各レポートファイルを
  #   直接読む。post-merge-feedback の aggregate-feedback と同パターン。
  # ---------------------------------------------------------------------------
  - name: aggregate-weekly
    edit: false
    persona: supervisor
    model: sonnet
    policy: review
    provider_options:
      claude:
        allowed_tools:
          - Read
          - Glob
          - Grep
    instruction: aggregate-weekly
    pass_previous_response: false
    output_contracts:
      report:
        - name: weekly-review.md
          format: weekly-review
        - name: findings.json
          format: findings-json
    rules:
      - condition: aggregation complete
        next: COMPLETE
